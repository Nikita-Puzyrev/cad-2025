<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
<h2>Product List</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
    </tr>
<tr>
    <td>2</td>
    <td>Cat Toy</td>
    <td>500.00</td>
    <td>50</td>
</tr>
<tr>
    <td>3</td>
    <td>Fish Tank</td>
    <td>7000.00</td>
    <td>5</td>
</tr>
</table>
</body>
</html>
