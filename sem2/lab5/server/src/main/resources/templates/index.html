<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список задач</title>
    <style>
        body { font-family: sans-serif; margin: 30px auto; max-width: 1100px; padding: 0 16px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #aaa; padding: 8px; text-align: left; }
        form.inline { display: inline; }
        button, input, select { padding: 5px; margin: 3px; }
    </style>
</head>
<body>
<h1>Список задач</h1>
<p>Приоритет: 1 — высокий, 2 — обычный, 3 — низкий. Время создания — UTC.</p>
<table>
    <thead><tr><th>ID</th><th>Описание</th><th>Статус</th><th>Приоритет</th><th>Создана</th><th th:if="${moderator}">Действия</th></tr></thead>
    <tbody>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.id}"></td>
        <td th:text="${task.description}"></td>
        <td th:text="${task.completed ? 'Выполнена' : 'В работе'}"></td>
        <td th:text="${task.priority}"></td>
        <td th:text="${task.createdAt}"></td>
        <td th:if="${moderator}">
            <form class="inline" th:action="@{/updateTask/{id}(id=${task.id})}" method="post">
                <input type="hidden" name="completed" th:value="${!task.completed}">
                <button type="submit">Сменить статус</button>
            </form>
            <form class="inline" th:action="@{/deleteTask/{id}(id=${task.id})}" method="post">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<p th:if="${#lists.isEmpty(tasks)}">Задач пока нет.</p>
<h2>Добавить задачу</h2>
<form th:action="@{/addTask}" method="post">
    <label>Описание <input name="description" maxlength="500" required></label>
    <label>Приоритет <select name="priority"><option value="1">Высокий</option><option value="2" selected>Обычный</option><option value="3">Низкий</option></select></label>
    <button type="submit">Добавить</button>
</form>
<form th:action="@{/logout}" method="post"><button type="submit">Выйти</button></form>
</body>
</html>
