<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>ToDo Tracker</title>
    <!-- Подключаем твой внешний CSS -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <h1>📝 ToDo List</h1>

    <ul>
        <li th:each="task : ${tasks}" th:classappend="${task.completed} ? 'completed-task' : ''">
            <div class="task-title">
                <strong th:text="${task.description}"></strong>
                <span th:class="${task.completed ? 'status-completed' : 'status-pending'}"
                      th:text="${task.completed ? '✅ Completed' : '⏳ Pending'}"></span>
            </div>

            <!-- Блок с новыми данными -->
            <div class="task-info">
                <span>📁 <span th:text="${task.category != null && !task.category.isEmpty() ? task.category : 'Без категории'}"></span></span>
                
                <span>🔥 Приоритет: 
                    <span th:class="'priority-' + ${task.priority}" th:text="${task.priority}"></span>
                </span>
                
                <span>🕒 <span th:text="${#temporals.format(task.createdAt, 'dd.MM.yyyy HH:mm')}"></span></span>
            </div>

            <!-- Кнопки действий -->
            <div class="actions">
                <a th:href="@{/deleteTask/{id}(id=${task.id})}" class="btn btn-delete">🗑 Delete</a>
                <form th:action="@{/updateTask/{id}(id=${task.id})}" method="post" th:unless="${task.completed}">
                    <input type="hidden" name="completed" value="true">
                    <button type="submit" class="btn btn-complete">✔ Mark as Completed</button>
                </form>
                <form th:action="@{/updateTask/{id}(id=${task.id})}" method="post" th:if="${task.completed}">
                    <input type="hidden" name="completed" value="false">
                    <button type="submit" class="btn btn-pending">⏳ Mark as Pending</button>
                </form>
            </div>
        </li>
        <li th:if="${tasks.isEmpty()}" class="empty-message" style="border-left: none; background: none; box-shadow: none;">
            📭 Список задач пуст. Добавьте первую задачу ниже!
        </li>
    </ul>

    <h2>➕ Add New Task</h2>
    <form th:action="@{/addTask}" method="post" class="add-form">
        <div class="form-group">
            <label for="description">Description:</label>
            <input type="text" id="description" name="description" placeholder="Что нужно сделать?" required>
        </div>

        <div class="form-group">
            <label for="category">Category:</label>
            <input type="text" id="category" name="category" placeholder="Например: Учеба, Работа">
        </div>

        <div class="form-group">
            <label for="priority">Priority:</label>
            <select id="priority" name="priority">
                <option value="LOW">Low</option>
                <option value="NORMAL" selected>Normal</option>
                <option value="HIGH">High</option>
            </select>
        </div>

        <button type="submit" class="btn btn-add">Add Task</button>
    </form>
</div>
</body>
</html>
