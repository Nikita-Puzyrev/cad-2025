<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ToDo Tracker</title>
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; color: #222; }
        h1 { margin-bottom: 4px; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { border: 1px solid #bbb; padding: 6px 10px; text-align: left; }
        th { background: #eef2f7; }
        .done { color: #777; text-decoration: line-through; }
        form.inline { display: inline; }
        .panel { border: 1px solid #ccd; background: #f7f9fc; padding: 12px 16px;
                 margin-top: 16px; }
        input[type=text], select { padding: 4px 6px; }
        .muted { color: #777; }
    </style>
</head>
<body>
<h1>ToDo List</h1>
<p class="muted">Всего задач: <span th:text="${total}">0</span></p>

<div class="panel">
    <form method="post" action="/addTask">
        <input type="text" name="title" placeholder="Название задачи" size="30" required/>
        <input type="text" name="description" placeholder="Описание" size="40"/>
        <select name="category">
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">Учеба</option>
        </select>
        <button type="submit">Добавить</button>
    </form>
</div>

<div class="panel">
    <form method="post" action="/addCategory">
        <input type="text" name="name" placeholder="Новая категория" size="24" required/>
        <button type="submit">Добавить категорию</button>
    </form>
    <form method="get" action="/" style="margin-top:8px">
        <label>Фильтр по категории:</label>
        <select name="category" onchange="this.form.submit()">
            <option value="">все категории</option>
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                    th:selected="${c == selectedCategory}">Учеба</option>
        </select>
        <noscript><button type="submit">Показать</button></noscript>
    </form>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Задача</th>
        <th>Описание</th>
        <th>Категория</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.id}">1</td>
        <td th:text="${task.title}" th:classappend="${task.completed} ? 'done'">Задача</td>
        <td th:text="${task.description}">Описание</td>
        <td th:text="${task.category}">Учеба</td>
        <td th:text="${task.completed} ? 'выполнена' : 'в работе'">в работе</td>
        <td>
            <form class="inline" method="post" th:action="@{'/updateTask/' + ${task.id}}">
                <input type="hidden" name="completed" th:value="${!task.completed}"/>
                <button type="submit"
                        th:text="${task.completed} ? 'Вернуть в работу' : 'Выполнено'">
                    Выполнено
                </button>
            </form>
            <a th:href="@{'/deleteTask/' + ${task.id}}">Удалить</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(tasks)}">
        <td colspan="6" class="muted">Задач нет</td>
    </tr>
    </tbody>
</table>
</body>
</html>
